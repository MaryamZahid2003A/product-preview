<!DOCTYPE html>
<html lang="en">
<head>
   <link rel="stylesheet" href="perfume.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>
<body>
  <div id="parent">
     <img  id="perfume_img"  src="images/image-product-desktop.jpg" width="300px" height="400px">
      <div id="card">
        <p id="heading">P E R F U M</p>
         <h2>Gabrielle<br>Essence Eau<br>De Parfum</h2>
          <p id="content">A floral,solar and voluptos interpretation composed by Olivier Polge, Perfumer-Creator for the house of CHANEL</p>
        <div id="price">
          <h2 id="total">$149.99</h2>
          <p id="firstprice">$169.99</p>
        </div>
        <button id="add_to_cart"><img  id="cart"   src="images/icon-cart.svg">Add to Cart</button>
      </div>
      
    </div>
</body>
</html>
